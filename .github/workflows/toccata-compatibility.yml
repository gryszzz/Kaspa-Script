name: Native Toccata compatibility

on:
  pull_request:
    paths: ["compatibility/toccata-v2/**", "compiler/**", "sdk/**", ".github/workflows/toccata-compatibility.yml"]
  push:
    branches: [main]
    paths: ["compatibility/toccata-v2/**", "compiler/**", "sdk/**", ".github/workflows/toccata-compatibility.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path compatibility/toccata-v2/Cargo.toml -- --check
      - run: cargo test --manifest-path compatibility/toccata-v2/Cargo.toml --locked --features silverscript
      - run: cargo clippy --manifest-path compatibility/toccata-v2/Cargo.toml --locked --all-targets --features silverscript -- -D warnings
